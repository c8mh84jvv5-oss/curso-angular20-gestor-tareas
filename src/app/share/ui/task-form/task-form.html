<div class="nueva-tarea">
    <input
        type="text"
        #inputTarea
        placeholder="Nueva Tarea"
        (keyup.enter)="agregar.emit(inputTarea.value); inputTarea.value = ''"
        />

    <button (click)="agregar.emit(inputTarea.value); inputTarea.value = ''">Agregar</button>

</div>
