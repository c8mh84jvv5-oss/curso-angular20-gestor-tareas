<main>
  
  <div class="div-block">  
    <h1>{{ title }}</h1>
  <div class="nueva-tarea">
    <input
      type="text"
      #inputTarea
      placeholder="Nueva Tarea"
      (keyup.enter)="taskStore.agregar(inputTarea.value); inputTarea.value = ''"
    />

    <button (click)="taskStore.agregar(inputTarea.value); inputTarea.value = ''">Agregar</button>
  </div>
<div class="div-block">  
  <ul>
    @for (tarea of taskStore.tareas(); track tarea.id) {
      <app-task-item
        [task]= "tarea"
        (toggle)= "taskStore.toggle( $event)"
        (removed)="taskStore.eliminar($event)" />

    } @empty {
      <li class="sin-tareas">No hay tareas. Agrega una!!</li>
    }
  </ul>
</div>

    <div class="borrar-tareas">
        <button 
        [disabled]="taskStore.completatas()<1"
        (click)="taskStore.limpiarCompletadas (); $event.stopPropagation()">Borrar ({{ taskStore.completatas() }}) completadas</button>
    </div >
    <br>
    <div class="div-block">  
      <p class="consola">
        Total: {{ taskStore.totalTareas() }},
        Pendientes: {{ taskStore.pendientes() }}, 
        Competatas: {{ taskStore.completatas() }}
  </div>
</div>
</main>

<router-outlet />
