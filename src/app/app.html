<main >
  <div class="div-block">  
    <h1>{{ title }}</h1>
  <app-task-form
  (agregar)="taskStore.agregar($event)"></app-task-form>
  
<div class="div-block">  
  <ul>
    @for (tarea of taskStore.tareas(); track tarea.id) {
      <app-task-item
        [task]= "tarea"
        (toggle)= "taskStore.toggle( $event)"
        (removed)="taskStore.eliminar($event)" />

    } @empty {
      <li class="sin-tareas">No hay tareas. Agrega una!!</li>
    }
  </ul>
</div>

    <div class="borrar-tareas">
        <button

  [class.shake-bottom]="animar()"

  [disabled]="taskStore.completatas() < 1"

  (click)="borrarCompletadas($event)">

  Borrar ({{ taskStore.completatas() }}) completadas

</button>
    </div >
    <br>
    
          <app-contadores></app-contadores>
</div>
</main>

<router-outlet />
